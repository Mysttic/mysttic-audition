name: Wydanie

# Wydanie powstaje, gdy na gałąź główną trafi zmiana VERSION.md (scalenie PR albo push).
# Sama poprawka kodu czy dokumentacji nie uruchamia niczego.
#
# Druga bramka jest w jobie `wersja`: jeśli tag o tej wersji już istnieje, bieg kończy się
# bez robienia czegokolwiek. Chroni to przed powtórnym wydaniem, gdy zmieni się sam opis
# w VERSION.md.
#
# Wydanie powstaje tylko w tym repozytorium: z jego Releases pobierają je ludzie i stamtąd
# czyta aktualizacja w aplikacji (updates.py).
on:
  push:
    branches: [main, master]
    paths:
      - VERSION.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wydanie
  cancel-in-progress: false

jobs:
  wersja:
    name: Numer wersji
    runs-on: ubuntu-latest
    outputs:
      wersja: ${{ steps.odczyt.outputs.wersja }}
      tag: ${{ steps.odczyt.outputs.tag }}
      wydajemy: ${{ steps.odczyt.outputs.wydajemy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: odczyt
        name: Wersja z VERSION.md
        run: |
          set -euo pipefail
          # Pierwsza linia, która jest samym numerem; reszta pliku to opis.
          wersja=$(grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION.md || true)
          if [ -z "$wersja" ]; then
            echo "::error file=VERSION.md::Nie znalazłem numeru wersji (oczekiwany format: 1.2.3)"
            exit 1
          fi
          if ! grep -qE "^## \[${wersja//./\\.}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Brak sekcji ## [$wersja] w CHANGELOG.md"
            exit 1
          fi
          tag="v$wersja"
          echo "wersja=$wersja" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag już istnieje, nie wydajemy drugi raz." >> "$GITHUB_STEP_SUMMARY"
            echo "wydajemy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Wydanie $tag" >> "$GITHUB_STEP_SUMMARY"
            echo "wydajemy=true" >> "$GITHUB_OUTPUT"
          fi

  wydanie:
    name: Paczka i wydanie
    needs: wersja
    if: needs.wersja.outputs.wydajemy == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.wersja.outputs.tag }}
      WERSJA: ${{ needs.wersja.outputs.wersja }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Testy aktualizacji i paczka korzystają tylko z biblioteki standardowej.
      - name: Testy
        run: python -m unittest discover -s tests -v

      - name: Paczka
        run: |
          set -euo pipefail
          python tools/pakiet.py dist
          cat dist/*-checksums.txt

      # Opis to sekcja tej wersji z CHANGELOG.md, ta sama, którą aplikacja pokazuje
      # w oknie aktualizacji.
      - name: Opis wydania
        run: |
          set -euo pipefail
          python - "$WERSJA" > opis.md <<'PY'
          import sys
          import updates
          tekst = open("CHANGELOG.md", encoding="utf-8").read()
          print(f"Mysttic Audition {sys.argv[1]}\n")
          print(updates.changelog_section(tekst, sys.argv[1]))
          PY
          cat opis.md

      - name: Wydanie
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --title "Mysttic Audition $WERSJA" \
            --notes-file opis.md \
            --target "$GITHUB_SHA"
